name: Feature proposal
description: A new API or behavior.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Read the scope rules in CONTRIBUTING.md first. An API that an official TanStack adapter has and nsh-query lacks needs no proposal: open a pull request. A feature of NSH's own needs this proposal accepted (label `accepted`) before a pull request. Changes to caching, retries or deduplication belong in TanStack/query.
  - type: dropdown
    id: scope
    attributes:
      label: Scope rule
      options:
        - "1. An API an official TanStack adapter (react, solid, vue, svelte, angular) has"
        - "2. Something of NSH's own (a platform signal, a persistence backend, an NSH component integration)"
        - "3. query-core behavior (then it belongs in TanStack/query)"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem it solves in an app, with an example.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API draft
      description: Signatures and a short usage example.
      render: tsx
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
