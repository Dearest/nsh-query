name: PR title

# Pull requests are squashed: their title becomes the commit release-please
# reads, so it must be a Conventional Commit.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::The title must be a Conventional Commit, such as 'feat: add useSomething' or 'fix(core): ...'. Got: $TITLE"
            exit 1
          fi
